<style>
  * { box-sizing: border-box; }
  :root {
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --page: #f5f7fb;
    --card: #ffffff;
    --green: #16a34a;
    --green-dark: #15803d;
    --header: #111827;
  }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--page);
    color: var(--ink);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--header);
    color: #fff;
    padding: 14px 14px 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
    line-height: 1.2;
  }
  .sub {
    font-size: 13px;
    opacity: .85;
  }
  .search {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border-radius: 12px;
    border: 0;
    font-size: 15px;
    outline: none;
  }
  main {
    padding: 12px;
    max-width: 780px;
    margin: auto;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat {
    background: var(--card);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    font-size: 13px;
  }
  .stat b {
    display: block;
    font-size: 20px;
    margin-top: 3px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
  }
  .topline {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }
  .num {
    font-size: 12px;
    color: var(--muted);
    font-weight: bold;
  }
  .name {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.25;
    margin-top: 4px;
  }
  .area {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }
  .phoneBtn {
    display: block;
    text-align: center;
    text-decoration: none;
    margin-top: 12px;
    background: var(--green);
    color: white;
    padding: 12px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 16px;
  }
  .phoneBtn.called {
    background: var(--green-dark);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
  }
  select {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    background: white;
    font: inherit;
    font-size: 15px;
  }
  select.called-locked {
    background: #ecfdf5;
    border-color: #86efac;
    font-weight: 700;
  }
  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .empty {
    display: none;
    text-align: center;
    color: var(--muted);
    padding: 42px 12px;
    font-weight: 700;
  }
  .hide { display: none; }
</style>
</head>
<body>
<header>
  <h1>Caller 2 Leads</h1>
  <div class="sub">Tap the phone button to mark a lead as Called instantly.</div>
  <input id="search" class="search" type="search" placeholder="Search doctor, city, phone..." />
</header>

<main>
  <section class="stats">
    <div class="stat">Total<b id="total">0</b></div>

  </section>

  <div id="list"></div>
  <div id="empty" class="empty">No leads match your search.</div>
</main>

let filtered = [...leads];

const statuses = ['Not called', 'Called', 'Not answered', 'Interested', 'Not interested', 'Follow up'];
const list = document.getElementById('list');
const search = document.getElementById('search');

function key(id, field) { return 'caller_lead_' + id + '_' + field; }
function getSaved(id, field, fallback = '') { return localStorage.getItem(key(id, field)) ?? fallback; }
function setSaved(id, field, value) { localStorage.setItem(key(id, field), value); }
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function phoneDisplay(phone) {
  const d = String(phone || '').replace(/\D/g, '').slice(-10);
  return d ? ('0' + d).replace(/(\d{6})(\d{5})/, '$1 $2') : 'No phone';
}
function telValue(phone) {
  const d = String(phone || '').replace(/\D/g, '').slice(-10);
  return d ? '+91' + d : '';
}
function statusFor(id) { return getSaved(id, 'status', 'Not called'); }
function noteFor(id) { return getSaved(id, 'note', ''); }

function render() {
  list.innerHTML = '';
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';

  filtered.forEach((lead) => {
    const status = statusFor(lead.id);
    const called = status === 'Called';
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card_lead_' + lead.id;
    card.innerHTML = `
      <div class="topline">
        <div>
          <div class="num">#${esc(lead.id)}</div>
          <div class="name">${esc(lead.name)}</div>
          <div class="area">${esc([lead.area, lead.city].filter(Boolean).join(', '))}</div>
        </div>
      </div>
      <a class="phoneBtn ${called ? 'called' : ''}" href="tel:${telValue(lead.phone)}" onclick="markCalled(${lead.id})">&#128222; ${esc(phoneDisplay(lead.phone))}</a>
      <div class="row">
        <div>
          <label for="status_${lead.id}">Status</label>
          <select id="status_${lead.id}" class="${called ? 'called-locked' : ''}" onchange="saveStatus(${lead.id}, this.value)">
            ${statuses.map(s => `<option value="${esc(s)}" ${status === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="note">Called is locked and only updates after tapping the phone button.</div>
    `;
    list.appendChild(card);
  });
  updateStats();
}

function updateStats() {
  document.getElementById('total').textContent = leads.length;
  const called = leads.filter(l => statusFor(l.id) === 'Called').length;
  const interested = leads.filter(l => statusFor(l.id) === 'Interested').length;
  document.getElementById('calledCount').textContent = called;
  document.getElementById('interestedCount').textContent = interested;
  document.getElementById('notCalledCount').textContent = leads.length - called;
}

function markCalled(id) {
  setSaved(id, 'status', 'Called');
  const select = document.getElementById('status_' + id);
  const button = document.querySelector('#card_lead_' + id + ' .phoneBtn');
  if (select) {
    select.value = 'Called';
    select.classList.add('called-locked');
  }
  if (button) button.classList.add('called');
  updateStats();
}

function saveStatus(id, value) {
  if (value === 'Called' && statusFor(id) !== 'Called') {
    const select = document.getElementById('status_' + id);
    if (select) select.value = statusFor(id);
    alert('Tap the phone button to mark this lead as Called.');
    return;
  }
  setSaved(id, 'status', value);
  const select = document.getElementById('status_' + id);
  if (select) select.classList.toggle('called-locked', value === 'Called');
  updateStats();
}

function saveNote(id, value) { setSaved(id, 'note', value); }

function applySearch() {
  const q = search.value.trim().toLowerCase();
  filtered = q ? leads.filter(l => [l.name, l.doctor, l.specialty, l.phone, l.city, l.area, l.state].join(' ').toLowerCase().includes(q)) : [...leads];
  render();
}

function csvEscape(value) { return '"' + String(value ?? '').replace(/"/g, '""') + '"'; }
function toCSV(rows) {
  const columns = ['Rank','Clinic Name','Doctor Name','Specialty','Phone','WhatsApp','City','Locality/Area','State','Google Rating','Number of Reviews','Website URL','Google Maps URL','Website Status','Lead Score','Status','Notes'];
  const body = rows.map(l => [l.id,l.name,l.doctor,l.specialty,l.phone,l.whatsapp,l.city,l.area,l.state,l.rating,l.reviews,l.website,l.maps,l.websiteStatus,l.score,statusFor(l.id),noteFor(l.id)].map(csvEscape).join(','));
  return [columns.join(','), ...body].join('\n');
}
function downloadCSV(csv, filename) {
  const link = document.createElement('a');
  link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  link.download = filename;
  link.click();
}
function exportStatus(status) {
  const rows = leads.filter(l => statusFor(l.id) === status);
  if (!rows.length) { alert('No ' + status.toLowerCase() + ' leads yet.'); return; }
  downloadCSV(toCSV(rows), status.toLowerCase().replace(/ /g, '_') + '_leads.csv');
}
function exportAll() { downloadCSV(toCSV(leads), 'caller_leads.csv'); }

search.addEventListener('input', applySearch);
render();
</script>
