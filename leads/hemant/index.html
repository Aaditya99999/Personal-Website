const statuses = ["Not Called", "Called", "Not Answered", "Interested", "Not Interested"];
const manualStatuses = ["Not Called", "Not Answered", "Interested", "Not Interested"];
const list = document.getElementById('list');
const search = document.getElementById('search');
const filter = document.getElementById('filter');
const count = document.getElementById('count');
statuses.forEach(s => { const o=document.createElement('option'); o.value=s; o.textContent=s; filter.appendChild(o); });
function key(i) { return 'callerLeadStatus_' + i; }
function getStatus(i, fallback) {
  const saved = localStorage.getItem(key(i));
  const oldMap = {
    'Called - No Answer': 'Not Answered',
    'Follow-up': 'Interested',
    'Demo Scheduled': 'Interested',
    'Converted': 'Interested',
    'Wrong Number': 'Not Interested',
    'Not Called': 'Not Called'
  };
  const value = oldMap[saved] ?? saved ?? oldMap[fallback] ?? fallback ?? 'Not Called';
  return statuses.includes(value) ? value : 'Not Called';
}
function statusOptions(currentStatus) {
  return statuses.map(s => {
    const selected = s === currentStatus ? 'selected' : '';
    const locked = s === 'Called' && currentStatus !== 'Called' ? 'disabled' : '';
    return `<option value="${s}" ${selected} ${locked}>${s}${locked ? ' 🔒' : ''}</option>`;
  }).join('');
}
function markCalled(i) {
  localStorage.setItem(key(i), 'Called');
}
function render() {
  const q = search.value.toLowerCase().trim();
  const f = filter.value;
  list.innerHTML = '';
  let shown = 0;
  leads.forEach((lead, i) => {
    const st = getStatus(i, lead.status);
    const hay = [lead.name, lead.phone, lead.city, lead.locality, st].join(' ').toLowerCase();
    if (q && !hay.includes(q)) return;
    if (f && st !== f) return;
    shown++;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="top">
        <div>
          <div class="name">${escapeHtml(lead.name || 'Unnamed Lead')}</div>
          <div class="place">${escapeHtml([lead.locality, lead.city].filter(Boolean).join(', '))}</div>
        </div>
        <div class="badge">#${i+1}</div>
      </div>
      <a class="phone" href="tel:${escapeHtml(lead.tel)}" data-call-index="${i}">📞 ${escapeHtml(lead.phone)}</a>
      <div class="statusBox">
        <label>Status</label>
        <select data-index="${i}">${statusOptions(st)}</select>
      </div>`;
    list.appendChild(card);
  });
  count.textContent = `${shown} of ${leads.length} leads showing`;
  document.querySelectorAll('a[data-call-index]').forEach(btn => {
    btn.addEventListener('click', e => {
      markCalled(e.currentTarget.dataset.callIndex);
    });
  });
  document.querySelectorAll('select[data-index]').forEach(sel => {
    sel.addEventListener('change', e => {
      if (e.target.value === 'Called' && getStatus(e.target.dataset.index) !== 'Called') {
        e.target.value = getStatus(e.target.dataset.index);
        return;
      }
      localStorage.setItem(key(e.target.dataset.index), e.target.value || 'Not Called');
      render();
    });
  });
}
function escapeHtml(str) { return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
search.addEventListener('input', render); filter.addEventListener('change', render); render();
