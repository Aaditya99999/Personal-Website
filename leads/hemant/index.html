    label { font-size: 12px; color: #6b7280; font-weight: 700; }
    select { width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 12px; background: white; font-size: 15px; }

const STORAGE_KEY = 'caller_2_lead_status_v1';
const statuses = ['Not called', 'Called', 'Not answered', 'Interested', 'Not interested'];
const manualStatuses = ['Not called', 'Not answered', 'Interested', 'Not interested'];
let saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); }
function getStatus(id) { return saved[id] || 'Not called'; }
function setStatus(id, status) { saved[id] = status; save(); updateStats(); }

function makeOptions(current) {
  let opts = '';
  for (const s of statuses) {
    const selected = s === current ? 'selected' : '';
    const disabled = s === 'Called' && current !== 'Called' ? 'disabled' : '';
    opts += `<option value="${s}" ${selected} ${disabled}>${s}</option>`;
  }
  return opts;
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = leads.map((lead, idx) => {
    const current = getStatus(lead.id);
    const lockedClass = current === 'Called' ? 'called-locked' : '';
    return `<div class="card" data-search="${(lead.name+' '+lead.phone+' '+lead.city+' '+lead.locality).toLowerCase()}" id="card_${lead.id}">
      <div class="topline">
        <div>
          <div class="num">#${idx + 1}</div>
          <div class="name">${escapeHtml(lead.name)}</div>
          <div class="area">${escapeHtml([lead.locality, lead.city].filter(Boolean).join(', '))}</div>
        </div>
      </div>
      <a class="phoneBtn" href="tel:${lead.tel}" onclick="markCalledInstant('${lead.id}')">📞 ${escapeHtml(lead.phone)}</a>
      <div class="row">
        <div>
          <label>Status</label>
          <select id="status_${lead.id}" class="${lockedClass}" onchange="manualStatusChange('${lead.id}', this)">
            ${makeOptions(current)}
          </select>
          <div class="note">Called is locked and only updates after tapping the phone button.</div>
        </div>
      </div>
    </div>`;
  }).join('');
  updateStats();
}

function markCalledInstant(id) {
  saved[id] = 'Called';
  save();
  const select = document.getElementById('status_' + id);
  if (select) {
    select.innerHTML = makeOptions('Called');
    select.value = 'Called';
    select.classList.add('called-locked');
  }
  updateStats();
}

function manualStatusChange(id, select) {
  if (select.value === 'Called') {
    select.value = getStatus(id);
    return;
  }
  saved[id] = select.value;
  save();
  select.classList.remove('called-locked');
  select.innerHTML = makeOptions(select.value);
  select.value = saved[id];
  updateStats();
}

function updateStats() {
  const counts = {'Not called': 0, 'Called': 0, 'Not answered': 0, 'Interested': 0, 'Not interested': 0};
  leads.forEach(l => counts[getStatus(l.id)]++);
  document.getElementById('total').textContent = leads.length;
  document.getElementById('calledCount').textContent = counts['Called'];
  document.getElementById('interestedCount').textContent = counts['Interested'];
  document.getElementById('notCalledCount').textContent = counts['Not called'];
}

function escapeHtml(str) {
  return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.card').forEach(card => {
    card.classList.toggle('hide', q && !card.dataset.search.includes(q));
  });
});
render();
</script>
</body>
</html>
