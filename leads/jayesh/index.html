const AADITYA = "917357397888";

LEADS.forEach(l => { LEADS_BY_ID[l.id] = l; });
const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwsDlPjmbzuewpijKn1IX-Anv4Iapy2WOzFZ73ohCyabzfHUV6fggNqxPWS8Hx5c881/exec";

function logToSheet(lead, action){
  if (!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.indexOf('PASTE_') === 0) return;
  const body = new URLSearchParams({
    id: lead.id,
    name: lead.name,
    phone: lead.phone,
    city: lead.city,
    action: action
  });
  fetch(SHEET_WEBHOOK_URL, { method: 'POST', mode: 'no-cors', body }).catch(()=>{});
}

function loadAnswered(){
  try{ return JSON.parse(localStorage.getItem('ablabs_answered') || '{}'); }catch(e){ return {}; }
}
function saveAnswered(obj){
  localStorage.setItem('ablabs_answered', JSON.stringify(obj));
}
let answeredState = loadAnswered();

function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
}

function isNoSite(status){
  const s = status.toLowerCase();
  return s.startsWith('no ') || s.includes('no website') || s.includes('no findings') || s.includes('no dedicated') || s.includes('no independent') || s.includes('no real') || s.includes('no own') || s.includes('no genuine') || s.includes('no confirmed');
}

function waMessage(lead){
  const time = new Date().toLocaleString('en-IN', {dateStyle:'medium', timeStyle:'short'});
  return `Call logged\nClinic: ${lead.name}\nNumber: ${lead.phone}\nCity: ${lead.city}\nTime: ${time}`;
}

    if (hideCalled && answeredState[l.id]) return false;
    return true;

        </a>
        <a class="btn btn-wa" href="https://wa.me/${AADITYA}?text=${waText}" target="_blank" rel="noopener" onclick="logToSheet(LEADS_BY_ID[${l.id}], 'WhatsApp Aaditya clicked'); markAnswered(${l.id})">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.52 3.48A11.86 11.86 0 0012.05 0C5.5 0 .2 5.3.2 11.85c0 2.09.55 4.13 1.6 5.93L0 24l6.4-1.68a11.8 11.8 0 005.65 1.44h.01c6.55 0 11.85-5.3 11.85-11.85 0-3.17-1.23-6.14-3.39-8.43zM12.06 21.6h-.01a9.7 9.7 0 01-4.95-1.36l-.35-.21-3.68.97.98-3.58-.23-.37a9.75 9.75 0 01-1.5-5.2c0-5.39 4.39-9.78 9.79-9.78 2.61 0 5.07 1.02 6.92 2.87a9.73 9.73 0 012.86 6.92c0 5.4-4.39 9.79-9.83 9.79zm5.36-7.34c-.29-.15-1.73-.85-2-.95-.27-.1-.46-.15-.66.15-.2.29-.76.95-.93 1.14-.17.2-.34.22-.63.07-.29-.15-1.24-.46-2.36-1.46-.87-.78-1.46-1.74-1.63-2.03-.17-.29-.02-.45.13-.6.13-.13.29-.34.44-.5.15-.17.2-.29.29-.49.1-.2.05-.37-.02-.51-.07-.15-.66-1.6-.91-2.19-.24-.58-.48-.5-.66-.51h-.56c-.2 0-.51.07-.78.37-.27.29-1.02 1-1.02 2.44s1.05 2.83 1.19 3.02c.15.2 2.06 3.14 4.99 4.4.7.3 1.24.48 1.67.61.7.22 1.34.19 1.84.12.56-.08 1.73-.71 1.98-1.39.24-.68.24-1.27.17-1.39-.07-.13-.26-.2-.55-.35z"/></svg>
          WhatsApp Aaditya
        </a>
      </div>

      ${answeredTime ? `<div class="called-row">${answeredTime}</div>` : ''}
      <div class="called-row">
        <label><input type="checkbox" ${isAnswered ? 'checked' : ''} onchange="toggleAnswered(${l.id}, this.checked)"> Answered</label>
      </div>
    </div>`;
  }).join('');
}

function markAnswered(id){
  answeredState[id] = answeredState[id] || Date.now();
  saveAnswered(answeredState);
  render();
}
function toggleAnswered(id, checked){
  if(checked){ answeredState[id] = Date.now(); }
  else{ delete answeredState[id]; }
  saveAnswered(answeredState);
  logToSheet(LEADS_BY_ID[id], checked ? 'Answered' : 'Answered unchecked');
  render();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function populateCityFilter(){
  const cities = [...new Set(LEADS.map(l => l.city))].sort();
  const sel = document.getElementById('cityFilter');
  sel.innerHTML = '<option value="">All cities</option>' + cities.map(c => `<option value="${c}">${c}</option>`).join('');
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('cityFilter').addEventListener('change', render);
document.getElementById('hideCalled').addEventListener('change', render);

populateCityFilter();
render();
</script>
