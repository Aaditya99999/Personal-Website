    const categoryIcons = {
      'AI Automation': '<svg class="w-10 h-10 text-[#1C1C1C]/30" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>',
      'Web Design': '<svg class="w-10 h-10 text-[#1C1C1C]/30" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>',

    };

    function getIconForCategory(category) {
      return categoryIcons[category] || categoryIcons['Web Design'];
    }

    function createBlogPostElement(post) {
      const link = document.createElement('a');
      link.href = post.url || '#';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.className = 'blog-card bg-[#FAFAF8] rounded-2xl p-6 w-full text-left no-underline block';
      link.dataset.postId = post.id;
      link.innerHTML = `
        <div class="flex flex-col md:flex-row gap-6">
         <div class="md:w-48 h-32 bg-[#D6CFC7]/30 rounded-xl flex-shrink-0 flex items-center justify-center">
          ${getIconForCategory(post.category)}
         </div>
         <div class="flex-1">
          <div class="flex items-center gap-3 mb-3"><span class="text-xs font-medium px-3 py-1 bg-[#1C1C1C]/5 rounded-full">${post.category}</span> <span class="text-xs text-[#1C1C1C]/50">${post.read_time}</span>
          </div>
          <h3 class="font-heading font-semibold text-lg mb-2">${post.title}</h3>
          <p class="text-sm text-[#1C1C1C]/60 line-clamp-2">${post.description}</p>
          <p class="text-xs text-[#1C1C1C]/40 mt-4">${post.date}</p>
         </div>
        </div>
      `;
      return link;
    }

    function renderBlogPosts() {
      const container = document.getElementById('blog-posts-container');
      if (!container) return;

      container.innerHTML = '';
      currentBlogPosts.forEach(post => {
        container.appendChild(createBlogPostElement(post));
      });
    }

    async function addBlogPost() {
      if (!newPostData.title || !newPostData.category || !newPostData.description) {
        return;
      }

      if (currentBlogPosts.length >= 999) {
        alert('Maximum limit of 999 posts reached. Please delete some posts first.');
        return;
      }

      const result = await window.dataSdk.create({
        id: Date.now().toString(),
        title: newPostData.title,
        category: newPostData.category,
        description: newPostData.description,
        read_time: newPostData.read_time,
        date: newPostData.date
      });

      if (result.isOk) {
        // Reset the form fields
        newPostData = { title: '', category: '', description: '', read_time: '', date: '' };
        
        // Update the edit panel to show cleared fields
        if (window.elementSdk) {
          window.elementSdk.setConfig({
            new_post_title: '',
            new_post_category: '',
            new_post_description: '',
            new_post_read_time: '',
            new_post_date: ''
          });
        }
      }
    }

    function subscribeNewsletter() {
      const form = event.target;
      const email = form.querySelector('input[type="email"]').value;
      const btn = form.querySelector('button');
      btn.textContent = 'Subscribed!';
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = 'Subscribe';
        btn.disabled = false;
        form.reset();
      }, 2000);
    }

    function openPost(title) {
      // Function removed - posts now link directly to URLs
    }

    async function onConfigChange(config) {
      const pageTitle = document.getElementById('page-title');
      const siteName = document.getElementById('site-name');
      
      if (pageTitle && config.page_title) {
        pageTitle.innerHTML = config.page_title.replace('insights', '<span class="font-serif italic font-normal">insights</span>');
      }
      if (siteName && config.site_name) {
        siteName.textContent = config.site_name;
      }

      // Update blog post form data
      if (config.new_post_title) newPostData.title = config.new_post_title;
      if (config.new_post_category) newPostData.category = config.new_post_category;
      if (config.new_post_description) newPostData.description = config.new_post_description;
      if (config.new_post_read_time) newPostData.read_time = config.new_post_read_time;
      if (config.new_post_date) newPostData.date = config.new_post_date;

      // Trigger add post when all fields are filled
      if (newPostData.title && newPostData.category && newPostData.description && newPostData.read_time && newPostData.date) {
        await addBlogPost();
      }

      // Apply colors
      document.documentElement.style.setProperty('--bg-primary', config.background_color || defaultConfig.background_color);
      document.documentElement.style.setProperty('--bg-secondary', config.surface_color || defaultConfig.surface_color);
      document.documentElement.style.setProperty('--text-primary', config.text_color || defaultConfig.text_color);
      document.documentElement.style.setProperty('--accent-black', config.primary_action_color || defaultConfig.primary_action_color);
      document.documentElement.style.setProperty('--accent-beige', config.secondary_action_color || defaultConfig.secondary_action_color);

      document.body.style.backgroundColor = config.background_color || defaultConfig.background_color;
      document.body.style.color = config.text_color || defaultConfig.text_color;

      // Apply font
      const fontFamily = config.font_family || defaultConfig.font_family;
      document.body.style.fontFamily = `${fontFamily}, sans-serif`;

      // Apply font size
      const baseSize = config.font_size || defaultConfig.font_size;
      document.body.style.fontSize = `${baseSize}px`;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => { config.background_color = value; window.elementSdk.setConfig({ background_color: value }); }
          },
          {
            get: () => config.surface_color || defaultConfig.surface_color,
            set: (value) => { config.surface_color = value; window.elementSdk.setConfig({ surface_color: value }); }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => { config.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          },
          {
            get: () => config.primary_action_color || defaultConfig.primary_action_color,
            set: (value) => { config.primary_action_color = value; window.elementSdk.setConfig({ primary_action_color: value }); }
          },
          {
            get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
            set: (value) => { config.secondary_action_color = value; window.elementSdk.setConfig({ secondary_action_color: value }); }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => { config.font_family = value; window.elementSdk.setConfig({ font_family: value }); }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => { config.font_size = value; window.elementSdk.setConfig({ font_size: value }); }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['page_title', config.page_title || defaultConfig.page_title],
        ['site_name', config.site_name || defaultConfig.site_name],
        ['new_post_title', newPostData.title || ''],
        ['new_post_category', newPostData.category || ''],
        ['new_post_description', newPostData.description || ''],
        ['new_post_read_time', newPostData.read_time || ''],
        ['new_post_date', newPostData.date || '']
      ]);
    }

    // Initialize Data SDK
    const dataHandler = {
      onDataChanged(data) {
        currentBlogPosts = data;
        renderBlogPosts();
      }
    };

    // Example blog posts to display on load
    const examplePosts = [
      {
        id: '1',
        title: 'How AI is Transforming Web Design',
        category: 'AI Automation',
        description: 'Explore the latest tools and techniques for automating design workflows with artificial intelligence.',
        read_time: '8 min read',
        date: 'January 15, 2025',
        url: 'https://example.com/ai-web-design'
      },
      {
        id: '2',
        title: 'Building No-Code Automation Workflows',
        category: 'No-Code',
        description: 'Learn how to create powerful automations without writing a single line of code using modern platforms.',
        read_time: '6 min read',
        date: 'January 10, 2025',
        url: 'https://example.com/no-code-automation'
      }
    ];

    async function initializeSdk() {
      // Display example posts immediately
      currentBlogPosts = examplePosts;
      renderBlogPosts();

      if (window.dataSdk) {
        await window.dataSdk.init(dataHandler);
      }

      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities,
          mapToEditPanelValues
        });
      }
    }

    initializeSdk();

    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    
    if (mobileMenuBtn && mobileMenu) {
      mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
      });

      // Close menu when a link is clicked
      mobileMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          mobileMenu.classList.add('hidden');
        });
      });
