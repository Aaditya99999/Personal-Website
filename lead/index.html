    const tableBody = document.getElementById("leadTable");
    const searchInput = document.getElementById("searchInput");
    const leadCount = document.getElementById("leadCount");

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderTable(list) {
      tableBody.innerHTML = "";

      list.forEach((lead, index) => {
        const whatsappLink = lead.waPhone
          ? `https://wa.me/${lead.waPhone}?text=${encodeURIComponent(lead.message)}`
          : "";

        const buttonHTML = whatsappLink
          ? `<a class="whatsapp-btn" href="${whatsappLink}" target="_blank" rel="noopener">💬 Open WhatsApp</a>`
          : `<span class="disabled">No number</span>`;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="serial" data-label="#">${index + 1}</td>
          <td class="name" data-label="Name">${escapeHTML(lead.name)}</td>
          <td class="phone" data-label="Number">${escapeHTML(lead.phone || "No number")}</td>
          <td data-label="WhatsApp">${buttonHTML}</td>
        `;

        tableBody.appendChild(row);
      });

      leadCount.textContent = `${list.length} leads shown`;
    }

    searchInput.addEventListener("input", () => {
      const query = searchInput.value.toLowerCase().trim();

      const filtered = leads.filter((lead) =>
        lead.name.toLowerCase().includes(query) ||
        lead.phone.toLowerCase().includes(query)
      );

      renderTable(filtered);
    });

    renderTable(leads);
  </script>
